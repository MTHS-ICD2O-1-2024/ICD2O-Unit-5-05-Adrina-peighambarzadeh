<!DOCTYPE html>

<html>

<head>
  <meta charset="utf-8" />
  <meta name="description" content="Types of triangle, in JS" />
  <meta name="keywords" content="mths, icd2o" />
  <meta name="author" content="Adrina peighamabrzadeh" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.brown-purple.min.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
  <link rel="manifest" href="site.webmanifest" />
  <title>Types of triangle, in JS</title>
</head>

<body>
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <script src="./js/script.js"></script>
  <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header">
      <div class="mdl-layout__header-row">
        <span class="mdl-layout-title">Types of triangle, in JS</span>
      </div>
    </header>
    <main class="mdl-layout__content">
      <div class="right-image">
        <img src="./images/Screenshot 2025-04-30 12.38.48.png" alt="triangle, with JS" />
      </div>
      <br />
      <div class="page-content">Enter in your lengths.</div>
      <form>
        <label class="page-content">Side a: </label>
        <div class="mdl-textfield mdl-js-textfield">
          <input class="mdl-textfield__input" type="text" pattern="-?[0-9]*(\.[0-9]+)?" id="side-a" />
          <label class="mdl-textfield__label" for="side-a">Enter without the unit</label>
          <span class="mdl-textfield__error">Input is not a number!</span>
        </div>
        <br />
        <label class="page-content">Side b: </label>
        <div class="mdl-textfield mdl-js-textfield">
          <input class="mdl-textfield__input" type="text" pattern="-?[0-9]*(\.[0-9]+)?" id="side-b" />
          <label class="mdl-textfield__label" for="side-b">Enter without the unit</label>
          <span class="mdl-textfield__error">Input is not a number!</span>
        </div>
        <br />
        <label class="page-content">Side c: </label>
        <div class="mdl-textfield mdl-js-textfield">
          <input class="mdl-textfield__input" type="text" pattern="-?[0-9]*(\.[0-9]+)?" id="side-c" />
          <label class="mdl-textfield__label" for="side-c">Enter without the unit</label>
          <span class="mdl-textfield__error">Input is not a number!</span>
        </div>
        <br />
        <!-- Accent-colored raised button with ripple -->
        <button class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent"
          onclick="checkTypeOfTriangle()" type="button">
          Check
        </button>
        <br />
        <div class="page-content-answer">
          <div id="answer"></div>
        </div>
    </main>
  </div>
</body>

</html>
